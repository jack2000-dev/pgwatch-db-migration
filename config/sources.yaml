# Reference only: live profiles are stored in PostgreSQL and managed at the
# pgwatch Web UI. Passwords are resolved from /run/pgwatch-secrets/pgpass.
- name: aws-publisher-orders-src
  conn_str: postgresql://pgwatch_monitor@aws-publisher.example.com:5432/orders?sslmode=verify-full&sslrootcert=/run/pgwatch-certs/aws-ca.pem&passfile=/run/pgwatch-secrets/pgpass
  kind: postgres
  is_enabled: true
  group: logical-replication
  custom_tags:
    provider: aws
    instance: aws-publisher-01
    environment: production
    migration_role: publisher
    migration_pair: orders-migration-01
  preset_metrics: logical_replication_publisher

- name: openstack-subscriber-orders-dst
  conn_str: postgresql://pgwatch_monitor@openstack-subscriber.example.com:5432/orders?sslmode=verify-full&sslrootcert=/run/pgwatch-certs/mycloud-ca.pem&passfile=/run/pgwatch-secrets/pgpass
  kind: postgres
  is_enabled: true
  group: logical-replication
  custom_tags:
    provider: mycloud
    instance: openstack-subscriber-01
    environment: production
    migration_role: subscriber
    migration_pair: orders-migration-01
  preset_metrics: logical_replication_subscriber
